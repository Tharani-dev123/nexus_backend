  url: "{{baseUrl}}/user/revoke-session"
  body:
    type: json
    data: |-
      {
        "sessionId":"{{sessionId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

