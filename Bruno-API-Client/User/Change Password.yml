info:
  name: Change Password
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/user/change-password"
  body:
    type: json
    data: |-
      {
        "currentPassword":"{{password}}",
        "newPassword":"newPassword"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

