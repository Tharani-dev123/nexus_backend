info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email":"{{email}}",
        "password":"{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.getBody();

        test("Check response success", function () {
            expect(jsonData.success).to.be.oneOf([true, false]);
        });

        if (jsonData.success) {
            bru.setVar("accessToken", jsonData.data.accessToken);
            if (jsonData.data.refreshToken) {
                bru.setVar("refreshToken", jsonData.data.refreshToken);
            }

            if (jsonData.data.user && jsonData.data.user.id) {
                bru.setVar("testUserId", jsonData.data.user.id);
            }
        } else {
            console.log("Login failed:", jsonData.error.message);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

