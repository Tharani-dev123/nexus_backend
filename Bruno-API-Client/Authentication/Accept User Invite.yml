info:
  name: Accept User Invite
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/accept-user-invite"
  body:
    type: json
    data: |-
      {
        "token": "{{inviteToken}}",
        "password": "{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

