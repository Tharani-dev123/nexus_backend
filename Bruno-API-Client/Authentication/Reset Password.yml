info:
  name: Reset Password
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "otp": "{{otp}}",
        "newPassword": "{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

