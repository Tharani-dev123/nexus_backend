info:
  name: Sign Up
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/signup"
  body:
    type: json
    data: |-
      {
        "email":"{{email}}",
        "password":"{{password}}",
        "name":"{{name}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

