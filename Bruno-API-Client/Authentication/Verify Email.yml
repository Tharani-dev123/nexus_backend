info:
  name: Verify Email
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/verify-email"
  body:
    type: json
    data: |-
      {
        "email":"{{email}}",
        "otp":"989487"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

