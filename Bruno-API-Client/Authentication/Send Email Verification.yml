info:
  name: Send Email Verification
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/send-verification-email"
  body:
    type: json
    data: |-
      {
        "email":"{{email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

