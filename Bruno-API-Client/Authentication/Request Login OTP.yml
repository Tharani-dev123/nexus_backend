info:
  name: Request Login OTP
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/request-login-otp"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

