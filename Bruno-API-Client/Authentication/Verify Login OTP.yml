info:
  name: Verify Login OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/verify-login-otp"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "otp": "{{otp}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

