info:
  name: Suspend Subscription
  type: http
  seq: 30

http:
  method: POST
  url: "{{baseUrl}}/admin/subscriptions/suspend"
  body:
    type: json
    data: |-
      {
        "companyId": "{{companyId}}",
        "reason": "Administrative review"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

