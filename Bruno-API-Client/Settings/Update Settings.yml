info:
  name: Update Settings
  type: http
  seq: 39

http:
  method: PATCH
  url: "{{baseUrl}}/settings/"
  body:
    type: json
    data: |-
      {
        "attendance": {
          "graceMinutes": 15,
          "lockDayOfMonth": 5
        },
        "tax": {
          "defaultRegime": "NEW"
        },
        "email": {
          "senderName": "HRMS System"
        },
        "notification": {
          "channels": ["EMAIL", "IN_APP"]
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

