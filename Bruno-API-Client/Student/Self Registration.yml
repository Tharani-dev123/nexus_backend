info:
  name: Self Registration
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseUrl}}/students/self-registration?companyId={{companyId}}"
  body:
    type: json
    data: |-
      {
        "enabled": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
