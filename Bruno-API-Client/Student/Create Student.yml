info:
  name: Create Student
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/students?companyId={{companyId}}"
  body:
    type: json
    data: |-
      {
        "name": "{{name}}",
        "email": "{{studentEmail}}",
        "branchId": "{{branchId}}",
        "admissionNumber": "{{admissionNumber}}",
        "departmentIds": []
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.getBody();
        if (jsonData.success && jsonData.data && jsonData.data.id) {
            bru.setVar("studentId", jsonData.data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
