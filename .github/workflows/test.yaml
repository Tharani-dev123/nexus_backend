
name: Build Check

on:
  pull_request:
    branches:
      - test
      - main

  push:
    branches:
      - test
      - main

jobs:
  test:
    name: Tests and Build
    runs-on: ubuntu-latest
    env:
      BETTERSTACK_LOG_PUSH: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm test

      - name: Run Build Check
        run: npm run build

  migrate-test-db:
    name: Apply Test Database Migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    needs: test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      BETTERSTACK_LOG_PUSH: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Test Database URL Is Configured
        run: |
          node -e 'if (!process.env.DATABASE_URL?.trim()) { console.error("TEST_DATABASE_URL is unavailable to this migration job."); process.exit(1); }'

      - name: Apply Pending Prisma Migrations
        run: npx prisma migrate deploy

  migrate-main-db:
    name: Apply Main Database Migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    environment: production

    env:
      DATABASE_URL: ${{ secrets.MAIN_DATABASE_URL }}
      BETTERSTACK_LOG_PUSH: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Main Database URL Is Configured
        run: |
          node -e 'if (!process.env.DATABASE_URL?.trim()) { console.error("MAIN_DATABASE_URL is unavailable to this migration job."); process.exit(1); }'

      - name: Apply Pending Prisma Migrations
        run: npx prisma migrate deploy
